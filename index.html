    <style>
      /* Bioluminescent Abyss — CSS custom properties from art direction */
      :root {
        --color-void:          oklch(5% 0.02 265);
        --color-depth:         oklch(8% 0.025 265);
        --color-trench:        oklch(11% 0.03 268);
        --color-current:       oklch(16% 0.04 268);
        --color-phosphor:      oklch(82% 0.18 162);
        --color-phosphor-dim:  oklch(64% 0.14 162);
        --color-phosphor-cold: oklch(40% 0.08 162);
        --color-biolum:        oklch(95% 0.09 162);
        --color-biolum-text:   oklch(97% 0.05 162);
        --color-ghost:         oklch(30% 0.05 268);
        --color-fossil:        oklch(42% 0.06 268);
        --color-death:         oklch(58% 0.22 15);
        --color-xp-bar:        oklch(55% 0.22 278);

        --text-display:  clamp(2.5rem, 6vw, 5rem);
        --text-title:    clamp(1.5rem, 3vw, 2.5rem);
        --text-subtitle: clamp(1rem, 2vw, 1.375rem);
        --text-body:     clamp(0.875rem, 1.2vw, 1rem);
        --text-ui:       clamp(0.75rem, 1vw, 0.875rem);
        --text-micro:    0.6875rem;

        --ease-emerge:   cubic-bezier(0.16, 1, 0.3, 1);
        --ease-sink:     cubic-bezier(0.4, 0, 1, 0.6);
        --ease-phosphor: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --ease-impact:   cubic-bezier(0, 0.9, 0.57, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--color-void, #09090f);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Syne", system-ui, sans-serif;
      }

      canvas {
        display: block;
      }
    </style>
